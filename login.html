<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вхід</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body class="body">
    <form class="registration-form">
      <h1>Вхід</h1>

      <!-- Email -->
      <div class="form-group">
        <label for="login-email">
          <i class="fa-solid fa-envelope"></i> Електронна адреса
        </label>
        <input
          type="email"
          id="login-email"
          name="email"
          placeholder="example@gmail.com"
          required
        />
        <small class="error-message"
          >Будь ласка, введіть коректну електронну адресу</small
        >
      </div>

      <!-- Пароль -->
      <div class="form-group">
        <label for="login-password">
          <i class="fa-solid fa-lock"></i> Пароль
        </label>
        <input
          type="password"
          id="login-password"
          name="password"
          placeholder="Введіть пароль"
          minlength="8"
          required
        />
        <small class="error-message"
          >Введіть пароль (не менше 8 символів)</small
        >
      </div>

      <!-- Кнопка входу -->
      <button type="submit">
        <i class="fa-solid fa-right-to-bracket"></i> Увійти
      </button>
    </form>
  </body>
</html>
